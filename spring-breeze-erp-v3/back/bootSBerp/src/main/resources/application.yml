spring:
  datasource:
    url: jdbc:oracle:thin:@localhost:1521/XEPDB1
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: update # test 환경 create-drop 매번 초기화 / update 부분 수정
    properties:
      hibernate:
        format_sql: true
        show_sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000

  config:
    import:
      - optional:application-oauth.yml
      - optional:file:.env[.properties]

mybatis:
  config-location: classpath:mybatis-config.xml
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.sb.erp.**.dto,com.sb.erp.**.dto.**

jwt:
  issuer: spring-breeze
  secret: ${JWT_SECRET}
  access-token-exp-seconds: 900
  refresh-token-exp-seconds: 1209600
  header: Authorization
  prefix: Bearer

#file:
#  upload-dir: uploads
upload:
  path: /upload # 웹에서 접근할 URL prefix (fileUrl = /upload/**/**/파일명)
resource:
  path: C:/upload # 실제 디스크 저장 경로 (운영 서버에서는 리눅스 절대경로로 교체)

#server:
#  port: 8484s

# Discord Webhook
webhook:
  discord:
    url: ${WEBHOOK_DISCORD_URL}

# Google Docs API
google:
  email:
    host: ${GOOGLE_EMAIL_HOST}
    user: ${GOOGLE_EMAIL_USER}
    password: ${GOOGLE_EMAIL_PASSWORD}
  report:
    client-id: ${GOOGLE_REPORT_CLIENT_ID}
    client-secret: ${GOOGLE_REPORT_CLIENT_SECRET}
    refresh-token: ${GOOGLE_REPORT_REFRESH_TOKEN}

# OpenAI API
openai:
  api:
    key: ${OPENAI_API_KEY}

# KJY OpenAI API
kjy:
  openai:
    api:
      key: ${KJY_OPENAI_API_KEY}

# CYJ
# 국세청 사업자등록정보 진위확인 API
nts:
  bizno:
    api: ${NTS_BIZNO_API_KEY}

# 네이버 클로바 OCR API
naver:
  ocr:
    secret: ${NAVER_OCR_SECRET}
    apiUrl: ${NAVER_OCR_API_URL}

# CoolSMS (문자 발송)
coolsms:
  apikey: ${COOLSMS_API_KEY}
  apisecret: ${COOLSMS_API_SECRET}
  # 사전 등록된 발신번호. 미설정 시 기존 동작(수신번호를 발신번호로도 사용)으로 폴백.
  sender: ${COOLSMS_SENDER}

# OpenAI API
cyj:
  openai:
    api:
      key: ${CYJ_OPENAI_API_KEY}
    model: ${CYJ_OPENAI_MODEL}

# JSJ OpenAI API
jsj:
  openai:
    api:
      key: ${JSJ_OPENAI_API_KEY}
      baseurl: ${JSJ_OPENAI_API_BASEURL}
      model: ${JSJ_OPENAI_API_MODEL}